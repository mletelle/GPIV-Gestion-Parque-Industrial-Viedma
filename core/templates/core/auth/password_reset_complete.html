{% extends 'base.html' %}

{% block title %}Contraseña actualizada — GPIV{% endblock %}

{% block extra_css %}
<style>
    .reset-wrap {
        min-height: calc(100vh - 200px);
        display: flex; align-items: center; justify-content: center;
        background: var(--gris-fondo); padding: 2rem 1rem;
    }
    .reset-card {
        background: #fff; border: 1px solid var(--borde);
        border-radius: var(--radio); padding: 2.5rem 2rem;
        width: 100%; max-width: 460px; text-align: center;
    }
    .reset-icon { font-size: 3rem; color: var(--verde); margin-bottom: 0.6rem; }
    .reset-card h2 {
        font-size: 1.35rem; font-weight: 700;
        color: var(--verde); margin-bottom: 0.5rem;
    }
    .reset-card p { color: var(--gris-suave); font-size: 0.9rem; }
</style>
{% endblock %}

{% block content %}
<div class="reset-wrap">
    <div class="reset-card">
        <div class="reset-icon"><i class="bi bi-check-circle-fill"></i></div>
        <h2>Contraseña actualizada</h2>
        <p class="mb-4">
            Tu contraseña fue restablecida correctamente. Ya podés iniciar sesión con la nueva clave.
        </p>
        <a href="{% url 'core:login' %}" class="btn-verde w-100 justify-content-center">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
