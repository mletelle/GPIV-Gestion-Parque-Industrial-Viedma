upstream gpiv_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Archivos estáticos (assets )
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy hacia Gunicorn
    location / {
        proxy_pass http://gpiv_app;
        # Usar $remote_addr (y NO $proxy_add_x_forwarded_for) para que Nginx
        # escriba SOLO la IP real del cliente TCP, descartando cualquier
        # cabecera X-Forwarded-For que el cliente pudiera haber enviado.
        # Con NUM_PROXIES=1 en settings.py, django-ratelimit lee este valor
        # y cada usuario tiene su propio bucket de rate-limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
